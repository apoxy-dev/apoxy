- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10080
  defaultFilterChain:
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        commonHttpProtocolOptions: {}
        generateRequestId: false
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 262144
          maxConcurrentStreams: 100
        httpFilters:
        - name: envoy.filters.http.jwt_authn
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
            providers:
              first-route/example:
                audiences:
                - foo.com
                forward: true
                fromCookies:
                - session_access_token
                fromHeaders:
                - name: Authorization
                  valuePrefix: 'Bearer '
                fromParams:
                - token
                issuer: https://www.example.com
                payloadInMetadata: https://www.example.com
                remoteJwks:
                  asyncFetch: {}
                  cacheDuration: 300s
                  httpUri:
                    cluster: localhost_443
                    timeout: 10s
                    uri: https://localhost/jwt/public-key/jwks.json
                  retryPolicy: {}
            requirementMap:
              first-route:
                providerName: first-route/example
        - disabled: true
          name: envoy.filters.http.compressor/default/gzip
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: gzip
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - disabled: true
          name: envoy.filters.http.compressor/default/brotli
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: brotli
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.brotli.compressor.v3.Brotli
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - disabled: true
          name: envoy.filters.http.compressor/default/zstd
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: zstd
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.zstd.compressor.v3.Zstd
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            suppressEnvoyHeaders: true
        mergeSlashes: true
        normalizePath: true
        pathWithEscapedSlashesAction: UNESCAPE_AND_REDIRECT
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: first-listener
        serverHeaderTransformation: PASS_THROUGH
        statPrefix: gw/first-listener
        useRemoteAddress: true
  drainType: MODIFY_ONLY
  name: first-listener
  perConnectionBufferLimitBytes: 1048576
