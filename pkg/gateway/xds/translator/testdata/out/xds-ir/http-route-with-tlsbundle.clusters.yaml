- circuitBreakers:
    thresholds:
    - maxConnections: 4294967295
      maxPendingRequests: 4294967295
      maxRequests: 4294967295
      maxRetries: 1024
      trackRemaining: true
  commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 10s
  dnsResolvers:
  - socketAddress:
      address: 127.0.0.1
      portValue: 8053
  edsClusterConfig:
    edsConfig:
      ads: {}
      resourceApiVersion: V3
    serviceName: httproute/envoy-gateway/httproute-btls/rule/0
  lbPolicy: LEAST_REQUEST
  name: httproute/envoy-gateway/httproute-btls/rule/0
  outlierDetection: {}
  perConnectionBufferLimitBytes: 1048576
  transportSocketMatches:
  - match:
      name: httproute/envoy-gateway/httproute-btls/rule/0/tls/0
    name: httproute/envoy-gateway/httproute-btls/rule/0/tls/0
    transportSocket:
      name: envoy.transport_sockets.tls
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        commonTlsContext:
          combinedValidationContext:
            defaultValidationContext:
              matchTypedSubjectAltNames:
              - matcher:
                  exact: example.com
                sanType: DNS
            validationContextSdsSecretConfig:
              name: policy-btls/policies-ca
              sdsConfig:
                ads: {}
                resourceApiVersion: V3
        sni: example.com
  type: EDS
