- circuitBreakers:
    thresholds:
    - maxConnections: 4294967295
      maxPendingRequests: 4294967295
      maxRequests: 4294967295
      maxRetries: 1024
      trackRemaining: true
  commonLbConfig:
    localityWeightedLbConfig: {}
  connectTimeout: 10s
  dnsFailureRefreshRate:
    baseInterval: 1s
    maxInterval: 2s
  dnsRefreshRate: 2s
  dnsResolvers:
  - socketAddress:
      address: 127.0.0.1
      portValue: 8053
  lbPolicy: LEAST_REQUEST
  loadAssignment:
    clusterName: first-route-dest
    endpoints:
    - lbEndpoints:
      - endpoint:
          address:
            socketAddress:
              address: foo.bar
              portValue: 50000
        loadBalancingWeight: 1
      - endpoint:
          address:
            socketAddress:
              address: bar.foo
              portValue: 50001
        loadBalancingWeight: 1
      loadBalancingWeight: 1
      locality:
        region: first-route-dest/backend/0
  name: first-route-dest
  outlierDetection: {}
  perConnectionBufferLimitBytes: 1048576
  type: STRICT_DNS
