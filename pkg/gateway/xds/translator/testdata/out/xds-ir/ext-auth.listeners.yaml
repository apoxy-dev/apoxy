- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10080
  defaultFilterChain:
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        commonHttpProtocolOptions: {}
        generateRequestId: false
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 262144
          maxConcurrentStreams: 100
        httpFilters:
        - disabled: true
          name: envoy.filters.http.ext_authz/httproute/default/httproute-1/rule/0/match/0/www_example_com
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            httpService:
              authorizationResponse:
                allowedUpstreamHeaders:
                  patterns:
                  - exact: header1
                    ignoreCase: true
                  - exact: header2
                    ignoreCase: true
              pathPrefix: /auth
              serverUri:
                cluster: securitypolicy/default/policy-for-first-route/http-backend
                timeout: 10s
                uri: http://http-backend.envoy-gateway:80/auth
            transportApiVersion: V3
        - disabled: true
          name: envoy.filters.http.ext_authz/httproute/default/httproute-2/rule/0/match/0/www_example_com
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            allowedHeaders:
              patterns:
              - exact: header1
                ignoreCase: true
              - exact: header2
                ignoreCase: true
            grpcService:
              envoyGrpc:
                authority: grpc-backend.default:9000
                clusterName: securitypolicy/default/policy-for-second-route/grpc-backend
              timeout: 10s
            transportApiVersion: V3
        - disabled: true
          name: envoy.filters.http.compressor/default/gzip
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: gzip
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - disabled: true
          name: envoy.filters.http.compressor/default/brotli
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: brotli
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.brotli.compressor.v3.Brotli
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - disabled: true
          name: envoy.filters.http.compressor/default/zstd
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: zstd
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.zstd.compressor.v3.Zstd
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            suppressEnvoyHeaders: true
        mergeSlashes: true
        normalizePath: true
        pathWithEscapedSlashesAction: UNESCAPE_AND_REDIRECT
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: first-listener
        serverHeaderTransformation: PASS_THROUGH
        statPrefix: gw/first-listener
        useRemoteAddress: true
  drainType: MODIFY_ONLY
  name: first-listener
  perConnectionBufferLimitBytes: 1048576
