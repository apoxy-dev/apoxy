- address:
    socketAddress:
      address: 0.0.0.0
      portValue: 10080
  defaultFilterChain:
    filters:
    - name: envoy.filters.network.http_connection_manager
      typedConfig:
        '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        commonHttpProtocolOptions: {}
        generateRequestId: false
        http2ProtocolOptions:
          initialConnectionWindowSize: 1048576
          initialStreamWindowSize: 262144
          maxConcurrentStreams: 100
        httpFilters:
        - disabled: true
          name: envoy.filters.http.ext_authz/httproute/default/httproute-2/rule/0/match/0/www_foo_com
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            httpService:
              authorizationResponse:
                allowedUpstreamHeaders:
                  patterns:
                  - exact: header1
                    ignoreCase: true
                  - exact: header2
                    ignoreCase: true
              pathPrefix: /auth
              serverUri:
                cluster: securitypolicy/default/policy-for-http-route-2/envoy-gateway/http-backend
                timeout: 10s
                uri: http://http-backend.envoy-gateway:80/auth
            transportApiVersion: V3
        - disabled: true
          name: envoy.filters.http.basic_auth/httproute/default/httproute-1/rule/0/match/0/www_foo_com
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.basic_auth.v3.BasicAuth
            users:
              inlineBytes: dXNlcjE6e1NIQX10RVNzQm1FL3lOWTNsYjZhMEw2dlZRRVpOcXc9CnVzZXIyOntTSEF9RUo5TFBGRFhzTjl5blNtYnh2anA3NUJtbHg4PQo=
        - disabled: true
          name: envoy.filters.http.oauth2_httproute/default/httproute-3/rule/0/match/0/www_bar_com
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.oauth2.v3.OAuth2
            config:
              authScopes:
              - openid
              - email
              - profile
              authType: BASIC_AUTH
              authorizationEndpoint: https://oauth.foo.com/oauth2/v2/auth
              credentials:
                clientId: client.oauth.foo.com
                cookieNames:
                  bearerToken: BearerToken-5F93C2E4
                  idToken: IdToken-5F93C2E4
                  oauthExpires: OauthExpires-5F93C2E4
                  oauthHmac: OauthHMAC-5F93C2E4
                  refreshToken: RefreshToken-5F93C2E4
                hmacSecret:
                  name: httproute/default/httproute-3/rule/0/match/0/www_bar_com/oauth2/hmac_secret
                  sdsConfig:
                    ads: {}
                    resourceApiVersion: V3
                tokenSecret:
                  name: httproute/default/httproute-3/rule/0/match/0/www_bar_com/oauth2/client_secret
                  sdsConfig:
                    ads: {}
                    resourceApiVersion: V3
              forwardBearerToken: true
              redirectPathMatcher:
                path:
                  exact: /foo/oauth2/callback
              redirectUri: https://www.example.com/foo/oauth2/callback
              signoutPath:
                path:
                  exact: /foo/logout
              tokenEndpoint:
                cluster: oauth_foo_com_443
                timeout: 10s
                uri: https://oauth.foo.com/token
        - disabled: true
          name: envoy.filters.http.compressor/default/gzip
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: gzip
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.gzip.compressor.v3.Gzip
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - disabled: true
          name: envoy.filters.http.compressor/default/brotli
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: brotli
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.brotli.compressor.v3.Brotli
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - disabled: true
          name: envoy.filters.http.compressor/default/zstd
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.compressor.v3.Compressor
            compressorLibrary:
              name: zstd
              typedConfig:
                '@type': type.googleapis.com/envoy.extensions.compression.zstd.compressor.v3.Zstd
            responseDirectionConfig:
              commonConfig:
                minContentLength: 128
        - name: envoy.filters.http.router
          typedConfig:
            '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
            suppressEnvoyHeaders: true
        mergeSlashes: true
        normalizePath: true
        pathWithEscapedSlashesAction: UNESCAPE_AND_REDIRECT
        rds:
          configSource:
            ads: {}
            resourceApiVersion: V3
          routeConfigName: default/gateway-1/http
        serverHeaderTransformation: PASS_THROUGH
        statPrefix: gw/default/gateway-1/http
        useRemoteAddress: true
  drainType: MODIFY_ONLY
  name: default/gateway-1/http
  perConnectionBufferLimitBytes: 1048576
