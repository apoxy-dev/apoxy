# Default values for apoxy-gateway.

# -- Override the deployment namespace; defaults to .Release.Namespace
namespaceOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

apiserver:
  image:
    repository: us-west1-docker.pkg.dev/apoxy-dev/public/apiserver
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    # tag: "latest"

  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  persistence:
    enabled: true
    # storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi

  podAnnotations: {}

  podSecurityContext: {}

  securityContext: {}

  service:
    port: 443

  resources: {}

  nodeSelector: {}
  tolerations: []
  affinity: {}

backplane:
  image:
    repository: us-west1-docker.pkg.dev/apoxy-dev/public/backplane
    pullPolicy: IfNotPresent
    # Overrides the image tag whose default is the chart appVersion.
    # tag: "latest"

  extraArgs: []

  envFrom: []

  extraEnv: []

  imagePullSecrets: []

  podAnnotations: {}

  podSecurityContext: {}

  securityContext:
    capabilities:
      add:
        - NET_BIND_SERVICE
        - NET_ADMIN

  service:
    type: ClusterIP
    annotations: {}
    externalTrafficPolicy: Cluster
    sourceRanges: []

  proxy:
    name: default
    drainTimeoutSeconds: 30
    initialDelaySeconds: 30
    listeners: [
      {
        name: "https",
        port: 443,
        protocol: "TCP",
      },
      {
        name: "http",
        port: 80,
        protocol: "TCP",
      }
    ]

  # Envoy overload manager configuration
  overload:
    # Maximum heap size in bytes for Envoy overload manager (0 to disable)
    maxHeapSizeBytes: 0
    # Maximum number of active downstream connections for Envoy overload manager (0 to disable)
    maxActiveConnections: 0

  resources: {}

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 100
    targetCPUUtilizationPercentage: 80
    # -- Pods metrics added to the HPA. Prometheus Adapter must expose each series
    # as a pods metric with the same name before the HPA can read it.
    # Example: [{name: envoy_http_downstream_cx_active, targetAverageValue: "2700"}]
    podsMetrics: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  extraVolumes: []

  extraVolumeMounts: []

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  controllerPodMonitor:
    enabled: false
    # -- Interval at which metrics should be scraped
    interval: "15s"
    # -- Additional labels for the PodMonitor
    additionalLabels: {}
    # -- Relabel configurations for the metrics
    relabelings: []
    # -- Metric relabel configurations
    metricRelabelings: []

  envoyPodMonitor:
    enabled: false
    # -- Interval at which metrics should be scraped
    interval: "15s"
    # -- Additional labels for the PodMonitor
    additionalLabels: {}
    # -- Relabel configurations for the metrics
    relabelings: []
    # -- Metric relabel configurations
    metricRelabelings: []

  # Alert rules for the Envoy process and the Envoy limits. The Prometheus
  # Operator must be installed before you enable this.
  #
  # EnvoyOverloadStopAcceptingRequests, EnvoyRssNearLimit and the heap panels of
  # the dashboard stay empty until Envoy knows a heap size and the container has
  # a memory limit. Set backplane.overload.maxHeapSizeBytes and
  # backplane.resources.limits.memory to get these signals.
  prometheusRule:
    enabled: false
    # -- Additional labels for the PrometheusRule and for every alert in it.
    # Set the label your Prometheus instance selects rules with.
    # Example: release: kube-prometheus-stack
    additionalLabels: {}
    thresholds:
      # -- Alert when the open file descriptors pass this part of the limit.
      fdUsageRatio: 0.8
      # -- Alert when the downstream connection pressure passes this percent.
      # Envoy writes the overload manager pressure as a percent from 0 to 100,
      # not as a part of 1. Envoy refuses new connections at 100.
      downstreamCxPressurePercent: 80
      # -- Alert when the Envoy RSS passes this part of the container limit.
      rssUsageRatio: 0.85
      # -- Alert when a dynamic forward proxy DNS cache passes this part of max_hosts.
      dnsCacheUsageRatio: 0.9
      # -- Alert when this many requests wait for a connection to one cluster.
      # The pending queue has no limit unless a policy sets maxPendingRequests,
      # so a long queue does not overflow. It shows only as request time.
      pendingActive: 512

  # Grafana dashboard for the Envoy process, the connections, the requests and
  # the limits. The Grafana dashboard sidecar reads the ConfigMap.
  grafanaDashboard:
    enabled: false
    # -- Labels for the dashboard ConfigMap. The sidecar selects the dashboards
    # with these labels.
    labels:
      grafana_dashboard: "1"
    # -- Annotations for the dashboard ConfigMap.
    # Example: grafana_folder: Apoxy
    annotations: {}
