{{- if .Values.backplane.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "apoxy-gateway.fullname" . }}-backplane-envoy-dashboard
  namespace: {{ include "apoxy-gateway.namespace" . }}
  labels:
    {{- include "apoxy-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: backplane
    {{- with .Values.backplane.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.backplane.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  backplane-envoy.json: |-
{{ .Files.Get "dashboards/backplane-envoy.json" | indent 4 }}
{{- end }}
