name: Setup Dagger
description: Install the Dagger CLI version declared in dagger.json.

runs:
  using: composite
  steps:
    - name: Install Dagger CLI
      # Pin dagger-for-github v8.4.1 to an audited commit. The version must be the
      # engineVersion in dagger.json; ci/internal/daggerversion checks it.
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
      with:
        version: "0.19.10"
