name: Setup Dagger
description: Install the Dagger CLI version declared in dagger.json.

runs:
  using: composite
  steps:
    - name: Read Dagger version
      id: version
      shell: bash
      run: |
        set -euo pipefail

        engine_version="$(jq -r '.engineVersion // empty' dagger.json)"
        if [[ ! "${engine_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "dagger.json has an invalid engineVersion: ${engine_version:-missing}" >&2
          exit 1
        fi
        echo "version=${engine_version#v}" >> "${GITHUB_OUTPUT}"

    - name: Install Dagger CLI
      # Pin dagger-for-github v8.4.1 to an audited commit.
      uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77
      with:
        version: ${{ steps.version.outputs.version }}
