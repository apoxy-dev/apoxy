name: Perf
on:
  schedule:
    # Nightly at 09:17 UTC.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Measured run length of each workload (the baseline keys include it)"
        type: string
        default: "30s"
permissions:
  contents: read
concurrency:
  group: perf
  cancel-in-progress: false
jobs:
  # netns + netem rig (cmd/perfrig) at 20 ms RTT. cmd/perfrig/baseline.json
  # holds the numbers of this runner type. The compare step fails on a
  # regression above the baseline tolerance (10%).
  netns-rig:
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 45
    env:
      DURATION: ${{ inputs.duration || '30s' }}
      SHUTUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dagger
      - name: Load sch_netem and raise socket buffer limits
        run: |
          uname -a
          if ! sudo modprobe sch_netem; then
            sudo apt-get update -q
            if ! { sudo apt-get install -yq "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }; then
              echo "::warning::Could not load sch_netem on the host. The rig fails if the kernel has no netem."
            fi
          fi
          # These keys are global on older kernels. Only the host can set them.
          sudo sysctl -w net.core.rmem_max=134217728 net.core.wmem_max=134217728 net.core.netdev_max_backlog=250000
      - name: Run the rig
        timeout-minutes: 30
        run: |
          mkdir -p perf
          dagger call -v perf --src=. --workload=iperf3-tcp --streams=1 --duration="$DURATION" -o perf/iperf3-tcp-p1.json
          dagger call -v perf --src=. --workload=iperf3-tcp --streams=4 --duration="$DURATION" -o perf/iperf3-tcp-p4.json
          dagger call -v perf --src=. --workload=iperf3-tcp --streams=4 --loss=0.1 --duration="$DURATION" -o perf/iperf3-tcp-p4-loss0.1.json
          dagger call -v perf --src=. --workload=iperf3-udp --streams=1 --duration="$DURATION" -o perf/iperf3-udp-p1.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf/
          if-no-files-found: warn
      - name: Compare with the baseline
        timeout-minutes: 10
        run: dagger call -v perf-compare --src=. --results=perf
