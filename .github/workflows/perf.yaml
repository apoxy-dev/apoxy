name: Perf
on:
  schedule:
    # Nightly at 09:17 UTC.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Measured run length of each row (the baseline keys include it)"
        type: string
        default: "30s"
      netns_rig:
        description: "Run the netns rig job"
        type: boolean
        default: true
      vpc_gate:
        description: "Run the VPC gate job"
        type: boolean
        default: false
      vpc_rows:
        description: "VPC rows to run, comma-separated, for example gate (default: all rows)"
        type: string
        default: ""
      vpc_profile:
        description: "Write pprof profiles of the VPC rows (slower; do not compare to the baseline)"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: perf
  cancel-in-progress: false
# Each job runs its rows on a new EC2 instance (c7a.8xlarge) that it launches
# and terminates. The runner only builds the binaries and waits for the
# results. The perf environment gives the jobs on main an AWS role with OIDC.
# cmd/perfrig/baseline.json has the numbers of the instance type. The jobs
# do not run until the PERF_AWS_ROLE_ARN variable is set.
jobs:
  # netns + netem rig (cmd/perfrig) with iperf3 at 20 ms RTT. All rows gate.
  netns-rig:
    if: vars.PERF_AWS_ROLE_ARN != '' && (github.event_name == 'schedule' || inputs.netns_rig)
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment: perf
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    env:
      DURATION: ${{ inputs.duration || '30s' }}
      RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-netns
      PERF_BUCKET: ${{ vars.PERF_BUCKET }}
      PERF_AWS_REGION: ${{ vars.PERF_AWS_REGION }}
      SLACK_PERF_WEBHOOK_URL: ${{ secrets.SLACK_PERF_WEBHOOK_URL }}
      SHUTUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dagger
      - name: Get AWS credentials
        # v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.PERF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PERF_AWS_REGION }}
      - name: Run the rig
        timeout-minutes: 55
        run: >-
          dagger call -v perf-netns --src=. --where=ec2 --duration="$DURATION"
          --run-tag="$RUN_TAG" --bucket="$PERF_BUCKET" --region="$PERF_AWS_REGION"
          --aws-access-key-id=env:AWS_ACCESS_KEY_ID --aws-secret-access-key=env:AWS_SECRET_ACCESS_KEY
          --aws-session-token=env:AWS_SESSION_TOKEN
          export --path=perf-netns
      - name: Clean up the bench instance
        # A cancel stops the run step before its own cleanup. Only always() steps run after a cancel.
        if: always()
        run: >-
          dagger call perf-cleanup --run-tag="$RUN_TAG" --bucket="$PERF_BUCKET" --region="$PERF_AWS_REGION"
          --aws-access-key-id=env:AWS_ACCESS_KEY_ID --aws-secret-access-key=env:AWS_SECRET_ACCESS_KEY
          --aws-session-token=env:AWS_SESSION_TOKEN
      - name: Write the job summary
        if: always() && hashFiles('perf-netns/summary.md') != ''
        run: dagger call perf-summary --results=perf-netns export --path="$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-netns/
          if-no-files-found: warn
      - name: Check the gate
        run: dagger call perf-check --results=perf-netns
      - name: Send a Slack alert
        # The step does not run when the secret is not set.
        if: failure() && github.event_name == 'schedule' && env.SLACK_PERF_WEBHOOK_URL != ''
        continue-on-error: true
        run: >-
          dagger call perf-notify --results=perf-netns --suite=netns --webhook=env:SLACK_PERF_WEBHOOK_URL
          --run-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --sha="$GITHUB_SHA"

  # VPC data path (cmd/vpcbench through the relay, 4 flows, 20 ms RTT): one
  # gated row and info rows. Dispatch only, until the baseline has the numbers
  # of the instance type.
  vpc-gate:
    if: vars.PERF_AWS_ROLE_ARN != '' && github.event_name == 'workflow_dispatch' && inputs.vpc_gate
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment: perf
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 60
    env:
      DURATION: ${{ inputs.duration || '30s' }}
      ROWS: ${{ inputs.vpc_rows }}
      PROFILE: ${{ inputs.vpc_profile || false }}
      RUN_TAG: ${{ github.run_id }}-${{ github.run_attempt }}-vpc
      PERF_BUCKET: ${{ vars.PERF_BUCKET }}
      PERF_AWS_REGION: ${{ vars.PERF_AWS_REGION }}
      SLACK_PERF_WEBHOOK_URL: ${{ secrets.SLACK_PERF_WEBHOOK_URL }}
      SHUTUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dagger
      - name: Get AWS credentials
        # v6.3.0
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.PERF_AWS_ROLE_ARN }}
          aws-region: ${{ vars.PERF_AWS_REGION }}
      - name: Run the VPC rows
        timeout-minutes: 55
        run: >-
          dagger call -v perf-vpc --src=. --where=ec2 --duration="$DURATION" --rows="$ROWS" --profile="$PROFILE"
          --run-tag="$RUN_TAG" --bucket="$PERF_BUCKET" --region="$PERF_AWS_REGION"
          --aws-access-key-id=env:AWS_ACCESS_KEY_ID --aws-secret-access-key=env:AWS_SECRET_ACCESS_KEY
          --aws-session-token=env:AWS_SESSION_TOKEN
          export --path=perf-vpc
      - name: Clean up the bench instance
        # A cancel stops the run step before its own cleanup. Only always() steps run after a cancel.
        if: always()
        run: >-
          dagger call perf-cleanup --run-tag="$RUN_TAG" --bucket="$PERF_BUCKET" --region="$PERF_AWS_REGION"
          --aws-access-key-id=env:AWS_ACCESS_KEY_ID --aws-secret-access-key=env:AWS_SECRET_ACCESS_KEY
          --aws-session-token=env:AWS_SESSION_TOKEN
      - name: Write the job summary
        if: always() && hashFiles('perf-vpc/summary.md') != ''
        run: dagger call perf-summary --results=perf-vpc export --path="$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-vpc-results
          path: perf-vpc/
          retention-days: 90
          if-no-files-found: warn
      - name: Check the gate
        run: dagger call perf-check --results=perf-vpc
      - name: Send a Slack alert
        # The step does not run when the secret is not set.
        if: failure() && github.event_name == 'schedule' && env.SLACK_PERF_WEBHOOK_URL != ''
        continue-on-error: true
        run: >-
          dagger call perf-notify --results=perf-vpc --suite=vpc --webhook=env:SLACK_PERF_WEBHOOK_URL
          --run-url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --sha="$GITHUB_SHA"
