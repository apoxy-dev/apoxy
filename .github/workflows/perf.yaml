name: Perf
on:
  schedule:
    # Nightly at 09:17 UTC.
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      duration:
        description: "Measured run length of each workload (the baseline keys include it)"
        type: string
        default: "30s"
      vpc_gate:
        description: "Run the VPC gate job"
        type: boolean
        default: false
      vpc_runner:
        description: "Runner label of the VPC gate job"
        type: string
        default: "apoxy-perf-16core"
      vpc_min_cpus:
        description: "VPC gate: infra error below this CPU count (lower it only for smoke runs)"
        type: number
        default: 8
permissions:
  contents: read
concurrency:
  group: perf
  cancel-in-progress: false
jobs:
  # netns + netem rig (cmd/perfrig) at 20 ms RTT. cmd/perfrig/baseline.json
  # holds the numbers of this runner type. The compare step fails on a
  # regression above the baseline tolerance (10%). A GitHub-hosted runner,
  # because the Blacksmith kernel (6.6.x) has no sch_netem module.
  netns-rig:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DURATION: ${{ inputs.duration || '30s' }}
      SHUTUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dagger
      - uses: ./.github/actions/setup-perf-host
      - name: Run the rig
        timeout-minutes: 30
        run: |
          mkdir -p perf
          dagger call -v perf --src=. --workload=iperf3-tcp --streams=1 --duration="$DURATION" -o perf/iperf3-tcp-p1.json
          dagger call -v perf --src=. --workload=iperf3-tcp --streams=4 --duration="$DURATION" -o perf/iperf3-tcp-p4.json
          dagger call -v perf --src=. --workload=iperf3-tcp --streams=4 --loss=0.1 --duration="$DURATION" -o perf/iperf3-tcp-p4-loss0.1.json
          dagger call -v perf --src=. --workload=iperf3-udp --streams=1 --duration="$DURATION" -o perf/iperf3-udp-p1.json
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf/
          if-no-files-found: warn
      - name: Compare with the baseline
        timeout-minutes: 10
        run: dagger call -v perf-compare --src=. --results=perf

  # VPC data path gate (cmd/vpcbench through the relay, 4 flows, 20 ms RTT) on a larger runner.
  # Dispatch only, until the baseline has the numbers of this runner.
  vpc-gate:
    if: github.event_name == 'workflow_dispatch' && inputs.vpc_gate
    runs-on: ${{ inputs.vpc_runner || 'apoxy-perf-16core' }}
    timeout-minutes: 45
    env:
      DURATION: ${{ inputs.duration || '30s' }}
      MIN_CPUS: ${{ inputs.vpc_min_cpus || 8 }}
      SLACK_PERF_WEBHOOK_URL: ${{ secrets.SLACK_PERF_WEBHOOK_URL }}
      SHUTUP: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-dagger
      - uses: ./.github/actions/setup-perf-host
      - name: Run the VPC rows
        timeout-minutes: 35
        run: dagger call -v perf-vpc --src=. --duration="$DURATION" --min-cpus="$MIN_CPUS" export --path=perf-vpc
      - name: Write the job summary
        if: always()
        run: cat perf-vpc/summary.md >> "$GITHUB_STEP_SUMMARY" || echo "The VPC rows wrote no summary." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-vpc-results
          path: perf-vpc/
          retention-days: 90
          if-no-files-found: warn
      - name: Check the gate
        run: |
          code=$(cat perf-vpc/gate-exit)
          case "$code" in
            0) echo "The VPC gate passed." ;;
            3) echo "::error::The VPC gate has an infra error. See the job summary and compare-gate.txt."; exit 1 ;;
            *) echo "::error::The VPC gate failed (exit $code). See the job summary and compare-gate.txt."; exit 1 ;;
          esac
      - name: Send a Slack alert
        # The step does not run when the secret is not set.
        if: failure() && env.SLACK_PERF_WEBHOOK_URL != ''
        continue-on-error: true
        run: .github/scripts/perf-vpc-slack.sh perf-vpc
