name: Perf probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Checks that the Blacksmith kernel can delay and drop packets with eBPF and fq,
  # which the perf rig needs without sch_netem. Each job summary has the result table.
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [blacksmith-16vcpu-ubuntu-2204, blacksmith-16vcpu-ubuntu-2404]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      RUNNER_LABEL: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .github/perf-probe/go.mod
          cache: false
      - name: Kernel facts
        shell: bash
        run: |
          set -uo pipefail
          kconfig() {
            if [ -r /proc/config.gz ]; then zcat /proc/config.gz
            elif [ -r "/boot/config-$(uname -r)" ]; then cat "/boot/config-$(uname -r)"
            else echo "no kernel config"; fi
          }
          steal() {
            read -r _ u n s i w q sq st _ < /proc/stat
            local t1=$((u + n + s + i + w + q + sq + st)) s1=$st
            sleep 5
            read -r _ u n s i w q sq st _ < /proc/stat
            awk -v a=$((st - s1)) -v b=$((u + n + s + i + w + q + sq + st - t1)) \
              'BEGIN { printf "CPU steal over 5 s: %.2f%%\n", 100 * a / b }'
          }
          {
            echo "### Kernel facts: $RUNNER_LABEL"
            echo
            echo '```'
            uname -a
            echo "nproc: $(nproc)"
            grep -m1 'model name' /proc/cpuinfo
            steal
            echo "BTF: $(test -e /sys/kernel/btf/vmlinux && echo yes || echo no)"
            if [ -d "/lib/modules/$(uname -r)" ]; then
              echo "/lib/modules/$(uname -r): $(find "/lib/modules/$(uname -r)" -name '*.ko*' | wc -l) modules"
            else
              echo "/lib/modules/$(uname -r): missing"
            fi
            echo "Loaded modules: $(cut -d' ' -f1 /proc/modules | tr '\n' ' ')"
            sysctl net.core.default_qdisc net.ipv4.tcp_congestion_control net.ipv4.tcp_available_congestion_control
            ip -V
            echo
            kconfig | grep -E 'CONFIG_(BPF_SYSCALL|BPF_JIT|NET_XGRESS|DEBUG_INFO_BTF|NET_SCH_(FQ|FQ_CODEL|ETF|TBF|HTB|NETEM|INGRESS|DEFAULT)|NET_CLS_(BPF|ACT)|NET_ACT_BPF|VETH)[ =]'
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY" 2>&1
      - name: Build the probe
        working-directory: .github/perf-probe
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/perf-probe" .
      - name: Run the probe
        shell: bash
        run: sudo RUNNER_LABEL="$RUNNER_LABEL" "$RUNNER_TEMP/perf-probe" | tee -a "$GITHUB_STEP_SUMMARY"
