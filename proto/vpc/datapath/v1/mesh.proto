syntax = "proto3";

package apoxy.vpc.datapath.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "proto/vpc/datapath/v1/types.proto";

option go_package = "github.com/apoxy-dev/apoxy/proto/vpc/datapath/v1;datapathv1";

// Mesh is the service of a relay on a mesh session (ALPN apoxy-mesh/1).
// Both relays serve it and call it.
service Mesh {
  // Open is the first call on a session. The relay that dialed calls it.
  rpc Open(MeshOpenRequest) returns (MeshOpenResponse);
  // Presence sends the attachments of the caller: the full set, then each
  // change. The caller opens it one time on a session.
  rpc Presence(stream PresenceUpdate) returns (google.protobuf.Empty);
  // SPIRows copies SPI rows to the relay of the receiver.
  rpc SPIRows(stream SPIRowUpdate) returns (google.protobuf.Empty);
  // TrunkKeys gives the peer relay trunk SAs for traffic to the caller.
  rpc TrunkKeys(KeysRequest) returns (KeysResponse);
  // Snapshot returns the snapshot of the host of the called relay, in parts.
  rpc Snapshot(SnapshotRequest) returns (stream SnapshotPart);
}

// MeshCloseCode is the QUIC application error code when a relay closes a
// mesh session.
enum MeshCloseCode {
  // Normal close, or a new session of the two relays replaced this one.
  MESH_CLOSE_CODE_UNSPECIFIED = 0;
  // The relay stops on purpose. Its attachments are gone.
  MESH_CLOSE_CODE_RESTART = 1;
  // The revision of the other relay is below the minimum of the relay that
  // closes. The reason gives the minimum.
  MESH_CLOSE_CODE_UPGRADE = 2;
  // The relay that closes does not have the other relay as a member: its name
  // is not in the member set, or its certificate failed the check.
  MESH_CLOSE_CODE_NOT_MEMBER = 3;
}

// MeshOpenRequest is the first message of the relay that dialed.
message MeshOpenRequest {
  // Revision of the dialer.
  Version version = 1;
  // Relay name of the dialer. Each relay process has its own name.
  string name = 2;
  // ID and agent addresses of the dialer. Many relays can have one ID.
  RelayRef relay = 3;
  // IP address of the PSP socket of the dialer. Empty means the remote IP
  // address of this session.
  string psp_host = 4;
  // Port of the PSP socket of the dialer. Zero means that it has no PSP socket.
  uint32 psp_port = 5;
}

// MeshOpenResponse is the answer of the relay that accepted.
message MeshOpenResponse {
  // Revision of the listener.
  Version version = 1;
  // Relay name of the listener.
  string name = 2;
  // ID and agent addresses of the listener.
  RelayRef relay = 3;
  // IP address of the PSP socket of the listener. Empty means the host that
  // the dialer dialed for this session.
  string psp_host = 4;
  // Port of the PSP socket of the listener. Zero means that it has no PSP socket.
  uint32 psp_port = 5;
}

// Presence tells that an attachment is on the sending relay.
message Presence {
  VPCRef vpc = 1;
  string attachment_id = 2;
  // Time of the change in Unix milliseconds. A relay sends each generation one
  // time, and the higher generation wins.
  uint64 generation = 3;
  // Overlay prefixes of the attachment: its addresses and its advertised routes.
  repeated string prefixes = 4;
  // True if the attachment is gone. The entry then has only the VPC, the
  // attachment ID and the generation.
  bool gone = 5;
  // SPIFFE ID of the agent of the attachment.
  string subject = 6;
  // Hello.name of the agent, or empty. It tells the agents of one subject apart.
  string agent_name = 7;
  // Tag (1 to 2^24 - 1) that the sending relay gives to the session of the agent.
  // All attachments of a session have it, and no other session at the same time.
  uint32 sender_tag = 8;
  // Hello.instance of the agent. With the subject and the agent name it names
  // one agent process. Zero from a relay or an agent before revision 16.
  fixed64 instance = 9;
  AnnouncerState state = 10;
  // AttachRequest.rank of the attachment: the order of this connection among
  // the connections of its agent process. The lower rank is selected first.
  uint32 rank = 11;
  // Generation of the first entry of the attachment, at the attach. A later
  // entry of the attachment, with a new state, has a higher generation and the
  // same value here. Zero reads as the generation.
  uint64 attached = 12;
  // Time from which the attachment can replace a live active announcer: the
  // time of the attach, or of the last return to the normal state, plus 30 s.
  // Before it, the selection takes the attachment after each normal announcer
  // whose time has passed. No value reads as a time that has passed.
  google.protobuf.Timestamp active_from = 13;
}

message PresenceUpdate {
  repeated Presence entries = 1;
  // True in the last message of the full set that starts a Presence call.
  bool end_of_full_set = 2;
}

// SPIRow is a forward row that a sender registered on the sending relay.
message SPIRow {
  VPCRef vpc = 1;
  // Trunk tag of the sender on the sending relay.
  uint32 sender_tag = 2;
  uint32 spi = 3;
  // Overlay address of the receiver.
  string destination = 4;
  google.protobuf.Duration expires_in = 5;
  // True if the row is removed.
  bool removed = 6;
}

message SPIRowUpdate {
  repeated SPIRow rows = 1;
}

// SnapshotRequest asks a member for the snapshot of its host.
message SnapshotRequest {}

// SnapshotPart is one part of the snapshot of a relay host. The relays do not
// read the bytes.
message SnapshotPart {
  // The next bytes of the snapshot, at most 1 MiB.
  bytes data = 1;
  // Size of the whole snapshot in bytes. Only the first part has it.
  uint64 total_size = 2;
}

// AnnouncerState is the state of an attachment as an announcer of its
// prefixes. The selection of the active announcer of a prefix takes the lower
// value first, also for a value that a relay does not know.
enum AnnouncerState {
  // The attachment takes traffic.
  ANNOUNCER_STATE_NORMAL = 0;
  // The session of the attachment closes soon. Selected only with no announcer
  // in the normal state.
  ANNOUNCER_STATE_DRAINING = 1;
  // The relay of the attachment does not hear the agent. Selected only with
  // no announcer in another state.
  ANNOUNCER_STATE_SUSPECT = 2;
}
