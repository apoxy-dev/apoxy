syntax = "proto3";

package apoxy.vpc.datapath.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "proto/vpc/datapath/v1/types.proto";

option go_package = "github.com/apoxy-dev/apoxy/proto/vpc/datapath/v1;datapathv1";

// Relay is the relay side of a relay session (ALPN apoxy-vpc/2). Agents and
// VTEPs call it.
service Relay {
  // Session starts with Hello and Welcome, then carries Sync. The relay sends
  // routes, NoRoute, key changes, config and drain. The agent sends Ack and
  // Status.
  rpc Session(stream SessionRequest) returns (stream SessionResponse);
  // Attach adds an attachment to the session.
  rpc Attach(AttachRequest) returns (AttachResponse);
  // Detach removes an attachment of the session: its routes and addresses.
  // Errors: NotFound.
  rpc Detach(DetachRequest) returns (google.protobuf.Empty);
  // Rekey gives the relay SAs for traffic from the relay to the agent.
  rpc Rekey(KeysRequest) returns (KeysResponse);
  // ResolvePeer finds how the relay reaches an address. Errors: NotFound,
  // PermissionDenied.
  rpc ResolvePeer(ResolvePeerRequest) returns (ResolvePeerResponse);
  // RegisterSPI adds forward rows for SPIs that a receiver gave to the caller.
  rpc RegisterSPI(RegisterSPIRequest) returns (google.protobuf.Empty);
  // UnregisterSPI removes forward rows of the caller.
  rpc UnregisterSPI(UnregisterSPIRequest) returns (google.protobuf.Empty);
  // RegisterLanes sets the lane ports of the caller. Errors: InvalidArgument,
  // AlreadyExists (a port is a source of another agent), FailedPrecondition.
  rpc RegisterLanes(RegisterLanesRequest) returns (google.protobuf.Empty);
  // Visit lets the caller use its address of another relay of the mesh on this
  // relay. Errors: Unimplemented (no mesh), and the codes in the README.
  rpc Visit(VisitRequest) returns (google.protobuf.Empty);
  // Grant gives a new grant for an attachment of the session. The grant ends
  // 15 minutes later. Errors: NotFound, Unavailable (the relay has no key).
  rpc Grant(GrantRequest) returns (GrantResponse);
}

// RelayCloseCode is the QUIC application error code when a relay closes a
// relay session.
enum RelayCloseCode {
  // Normal close.
  RELAY_CLOSE_CODE_UNSPECIFIED = 0;
  // The agent cert failed a check. The agent gets a new cert before it dials
  // again.
  RELAY_CLOSE_CODE_CERT = 1;
  // The relay stops. The agent moves to another relay.
  RELAY_CLOSE_CODE_DRAIN = 2;
  // The agent revision is below the minimum of the relay. The reason gives
  // the minimum. The agent stops, and its user upgrades it.
  RELAY_CLOSE_CODE_UPGRADE = 3;
}

// SessionRequest is a message from the agent on Session.
message SessionRequest {
  oneof msg {
    // First message.
    Hello hello = 1;
    Ack ack = 2;
    Status status = 3;
    // The attachments of the same name on the other relays of the agent.
    RemoteAddresses remote = 5;
  }
  reserved 4;
  reserved "moved";
}

// RemoteAddresses gives, for one attachment of the session, the attachments
// of the same name on the other relays of the agent. Each message replaces the
// last one for that attachment.
message RemoteAddresses {
  // Attachment of the session.
  string attachment_id = 1;
  repeated RemoteAttachment attachments = 2;
}

// RemoteAttachment is an attachment of the agent on another relay.
message RemoteAttachment {
  // ID of that relay, as its Welcome gave it.
  string relay_id = 1;
  // Attachment ID on that relay.
  string attachment_id = 2;
  // Address prefixes of the attachment on that relay.
  repeated string addresses = 3;
}

// SessionResponse is a message from the relay on Session.
message SessionResponse {
  oneof msg {
    // First message.
    Welcome welcome = 1;
    RouteDelta route_delta = 2;
    NoRoute no_route = 3;
    // Key change for traffic from the agent to the relay.
    KeysRequest rekey = 4;
    Config config = 5;
    Drain drain = 6;
    // Receive counters of the relay SAs, each second when they change.
    RxReport rx_report = 7;
  }
}

// Hello starts a session.
message Hello {
  // Data transport that the agent wants. Each session starts in QUIC mode,
  // and a Rekey call changes it to PSP mode.
  Mode mode = 1;
  // Maximum number of VPCs on this session. In the MVP the cert names one VPC.
  uint32 max_vpcs_per_session = 2;
  // Set on an extra connection of a session in QUIC mode. The connection
  // then carries only data datagrams, and the relay ignores mode.
  Shard shard = 3;
  // Why the agent is in QUIC mode.
  FallbackReason fallback_reason = 4;
  // An agent of an older build set spare here for a session with no attachment.
  reserved 5;
  reserved "spare";
  // Revision of the agent. Not set by a build from before revisions.
  Version version = 6;
  // Name of the base attachment of the agent. Many agents can have one SPIFFE
  // ID, each with its own name.
  string name = 7;
  // The agent takes only the routes of the attachments on this relay. If not
  // set, the relay sends also the routes of the attachments on other relays.
  bool local_routes_only = 8;
  // Random ID of the agent process, new at each process start: the value of
  // Open.instance on the peer sessions. Two sessions with one SPIFFE ID, one
  // name and one instance are of one agent process, also on two relays. Zero
  // from an agent before revision 16.
  fixed64 instance = 9;
}

// Shard joins a connection to the session of an attachment. The session
// connection is shard 0.
message Shard {
  // Attachment of the session. Its agent must have the identity of this cert.
  string attachment_id = 1;
  // Index of the shard, from 1 to 3.
  uint32 index = 2;
}

// Welcome answers Hello.
message Welcome {
  // Source address and port of the agent as the relay sees them.
  string reflexive_address = 1;
  // Most ports that RegisterLanes takes. Zero means that the relay takes no
  // lane ports.
  uint32 max_lanes = 2;
  // Revision of the relay. Not set by a build from before revisions.
  Version version = 3;
  // IP address of the PSP socket of the relay. Empty means the host that the
  // agent dialed for this session. The agent sends its path probes, its PSP
  // packets and its lane keep-alives to this host at psp_port.
  string psp_host = 4;
  // Port of the PSP socket of the relay.
  uint32 psp_port = 5;
  // ID of the relay.
  string relay_id = 6;
}

// Route is a prefix in a VPC.
message Route {
  VPCRef vpc = 1;
  string prefix = 2;
  // Attachment that gets the packets for the prefix. When more than one
  // attachment announces the prefix, it is the active announcer.
  string origin = 3;
  // The other attachments that announce the prefix, in the order in which
  // they become the active announcer. Only in an added route, for an agent at
  // revision 16 or later. An added route that the agent has gives a new list.
  repeated string standby = 4;
  // Relay that has the origin, also this relay for a local origin. It can
  // have the ID and no addresses.
  RelayRef relay = 5;
}

// RouteDelta changes the routes of the agent.
message RouteDelta {
  // Revision after this delta. It increases with each delta on a session.
  uint64 rev = 1;
  repeated Route add = 2;
  repeated Route remove = 3;
}

// Ack tells the relay that the agent applied the deltas up to rev.
message Ack {
  uint64 rev = 1;
}

// Status reports agent counters to the relay.
message Status {
  // ICV failures of receive SAs since the last Status.
  repeated ICVFailures icv_failures = 1;
  // Time to connect: from the start of the dial to the first Config. Only the
  // first Status of a session has it.
  google.protobuf.Duration connect_time = 2;
}

// ICVFailures is the ICV failure count of one receive SA.
message ICVFailures {
  uint32 spi = 1;
  uint64 count = 2;
}

// NoRoute tells the agent that the relay cannot reach an address. The relay
// sends at most one each second for each address.
message NoRoute {
  VPCRef vpc = 1;
  string address = 2;
  // Home relay of the peer, if the agent must attach to it as a visitor to
  // reach the address. Not set in each other case.
  RelayRef home_relay = 3;
}

// Config is the configuration of a VPC for the agent.
message Config {
  VPCRef vpc = 1;
  // Inner MTU.
  uint32 mtu = 2;
  repeated string dns_servers = 3;
  repeated string dns_search_domains = 4;
}

// Drain tells the agent to move to other relays. The relay closes the
// session later.
message Drain {
  repeated RelayRef alternates = 1;
}

message AttachRequest {
  VPCRef vpc = 1;
  // Attachment name. The CLI uses the host name by default.
  string name = 2;
  map<string, string> labels = 3;
  // Prefixes that the attachment advertises into the VPC.
  repeated string routes = 4;
  // Order of this connection among the connections of the agent process to
  // relays that announce the same routes. The relays select the lower rank
  // first. Zero from an agent before revision 16.
  uint32 rank = 5;
}

message AttachResponse {
  string attachment_id = 1;
  // Grant with the addresses of the attachment.
  AttachmentGrant grant = 2;
  // Answer of the relay for each route of the request, in the order of the
  // request, for an agent at revision 16 or later. A route with no answer is
  // accepted.
  repeated RouteStatus routes = 3;
  // Address prefixes that the relay gives the attachment.
  repeated string addresses = 4;
}

message DetachRequest {
  string attachment_id = 1;
}

message GrantRequest {
  // Attachment of the session of the caller.
  string attachment_id = 1;
}

message GrantResponse {
  // Grant with the claims of the grant of Attach and a new not_after.
  AttachmentGrant grant = 1;
}

// Reach tells how a relay reaches a peer.
enum Reach {
  REACH_UNSPECIFIED = 0;
  // The peer is on this relay.
  REACH_LOCAL = 1;
  // The peer is on another relay. This relay sends over the trunk.
  REACH_TRUNK = 2;
  // The mesh session to the home relay of the peer is down. Attach to that
  // relay as a visitor.
  REACH_VISIT = 3;
}

message ResolvePeerRequest {
  VPCRef vpc = 1;
  // Overlay address of the peer.
  string address = 2;
}

message ResolvePeerResponse {
  Reach reach = 1;
  // Home relay of the peer. Set for REACH_VISIT.
  RelayRef home_relay = 2;
  // True if P2P with the peer is allowed.
  bool p2p = 3;
  // SPIFFE ID of the peer. Set for REACH_LOCAL and REACH_TRUNK.
  string subject = 4;
  // Attachments of the session that has the address. Set for REACH_LOCAL and
  // REACH_TRUNK.
  repeated string attachment_ids = 5;
}

message RegisterSPIRequest {
  VPCRef vpc = 1;
  // Overlay address of the receiver that created the SPIs.
  string destination = 2;
  repeated uint32 spis = 3;
  // Time until the rows expire.
  google.protobuf.Duration expires_in = 4;
  // Lane of each SPI, in the order of spis: 0 is the session address, and i
  // is port i of RegisterLanes. Empty means lane 0 for all.
  repeated uint32 lanes = 5;
  // SA lane of each SPI at the receiver, in the order of spis. Empty means
  // SA lane 0 for all.
  repeated uint32 sa_lanes = 6;
}

message UnregisterSPIRequest {
  VPCRef vpc = 1;
  repeated uint32 spis = 2;
}

// RegisterLanesRequest replaces the lane ports of the caller. Each port is a
// UDP port at the IP address of the session, from which the agent sends PSP
// packets. Empty removes them.
message RegisterLanesRequest {
  repeated uint32 ports = 1;
  // The agent reads the lane ports. The relay then sends the PSP packets of SA
  // lane i to lane port i mod (ports + 1), where 0 is the session address.
  bool receive = 2;
}

// VisitRequest makes the session of the caller a visitor. The session needs a
// Session call with local_routes_only, and it has and had no attachment.
message VisitRequest {
  VPCRef vpc = 1;
  // Overlay address of the caller on its home relay.
  string address = 2;
  // Grant of the home relay for the attachment that has the address.
  AttachmentGrant grant = 3;
}

// FallbackReason is why an agent sends data in QUIC mode.
enum FallbackReason {
  // No fallback: the agent is in PSP mode.
  FALLBACK_REASON_UNSPECIFIED = 0;
  // No PSP probe got a reply before the probe timer ended.
  FALLBACK_REASON_PROBE_TIMEOUT = 1;
  // The agent config sets QUIC mode.
  FALLBACK_REASON_CONFIG = 2;
}

// RouteResult tells if the relay took an advertised route of an attachment.
// Each value that is not ROUTE_RESULT_ACCEPTED, also a value of a later
// revision, is a refused route: the attachment is not an announcer of it.
enum RouteResult {
  // The attachment is an announcer of the prefix.
  ROUTE_RESULT_ACCEPTED = 0;
  // Refused: the prefix is a default route (length 0).
  ROUTE_RESULT_DEFAULT_ROUTE = 1;
  // Refused: the prefix overlaps the network of the VPC, from which the relay
  // assigns the addresses of the attachments.
  ROUTE_RESULT_OVERLAPS_VPC = 2;
  // Refused: the prefix is IPv4 or IPv4-mapped. An IPv4 address is reachable
  // only in the /96 of an attachment.
  ROUTE_RESULT_IPV4 = 3;
}

// RouteStatus is the answer of the relay for one advertised route.
message RouteStatus {
  // The route of the request, in the masked form.
  string prefix = 1;
  RouteResult result = 2;
}
